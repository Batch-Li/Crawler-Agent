[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'signalx-news-signals'
version = '0.1.0'
description = 'News signal discovery and external Agent trigger'
requires-python = '>=3.11'
dependencies = ['pydantic>=2.7,<3']

[tool.setuptools.packages.find]
include = ['news_signals*']

[tool.setuptools.package-data]
'news_signals._core' = ['default_config/*.json']
